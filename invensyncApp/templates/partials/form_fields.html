{% for field in form %}
    <div class="field-group{% if field.errors %} field-invalid{% endif %}">
        <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true">*</span>{% endif %}</label>
        {{ field }}
        {% if field.help_text %}<small class="field-help">{{ field.help_text }}</small>{% endif %}
        {% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
    </div>
{% endfor %}
{% if form.non_field_errors %}
    <div class="form-errors" role="alert">{% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}</div>
{% endif %}
